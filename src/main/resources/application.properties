quarkus.application.name=inventory-server

# Storage backend: memory (default) or pg. In pg mode configure
# quarkus.datasource.reactive.url (and credentials) or enable Dev Services.
inventory.storage=memory
inventory.principal=inventory-server

# Milestone-1 static API token; replaced by TokenService-issued tokens later.
inventory.api.token=dev-token

# No datasource is configured in memory mode; keep Dev Services and the
# datasource health probe from demanding one.
quarkus.devservices.enabled=false
quarkus.datasource.health.enabled=false
