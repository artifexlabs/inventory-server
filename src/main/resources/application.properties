quarkus.application.name=inventory-server
# Health only — the worker host has no REST surface. The HTTP tier is
# inventory-web-api (:8081); all work arrives over the event-bus fabric.
quarkus.http.port=8082

# Storage backend: memory (default) or pg. In pg mode configure
# quarkus.datasource.reactive.url (and credentials) or enable Dev Services.
inventory.storage=memory
inventory.principal=inventory-server

# The shared bus-fabric token every envelope must present. Change it outside
# dev, and give the HTTP gateway the same value.
inventory.bus.token=dev-bus-token

# Admin user ensured at startup (idempotent). Change these outside dev.
inventory.admin.email=admin@example.com
inventory.admin.password=change-me

# Static token seeded into the in-memory TokenService (memory mode only);
# pg mode issues tokens exclusively via the auth.login bus action.
inventory.api.token=dev-token

# OIDC exchange provisioning policy enforced by the auth worker:
# invited (default — the email must already be a user) or auto.
inventory.oidc.provision=invited

# Domain-fact publication (VERTICLES.md): none (default) | local | clustered.
# The audit table stays the log of record either way.
inventory.events.bus=none

# Dev Services may start a Postgres container in dev/test when a datasource
# is demanded (pg mode); memory mode never touches it. The datasource health
# probe stays off so memory mode reports UP without a database.
quarkus.devservices.enabled=true
quarkus.datasource.health.enabled=false
